<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Satin Ribbon Gradients -->
    <linearGradient id="outerRibbon" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FCEEF0" />
      <stop offset="35%" stop-color="#F4A6B0" />
      <stop offset="70%" stop-color="#E28292" />
      <stop offset="100%" stop-color="#C96576" />
    </linearGradient>

    <linearGradient id="midRibbon" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FAD3D9" />
      <stop offset="65%" stop-color="#F4A6B0" />
      <stop offset="100%" stop-color="#D96E80" />
    </linearGradient>

    <linearGradient id="innerFold" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="50%" stop-color="#F8B8C2" />
      <stop offset="100%" stop-color="#C45366" />
    </linearGradient>

    <linearGradient id="goldFilament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="50%" stop-color="#F5EFC0" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C2E2D2" />
      <stop offset="50%" stop-color="#8BBFA8" />
      <stop offset="100%" stop-color="#558C73" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F4A6B0" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Delicate Ribbon Leaves -->
  <path d="M22 68 C12 60 14 44 26 40 C28 52 35 62 44 67 C35 70 27 71 22 68 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M78 68 C88 60 86 44 74 40 C72 52 65 62 56 67 C65 70 73 71 78 68 Z" fill="url(#leafGrad)" opacity="0.85" />

  <!-- Outer Folded Satin Petals -->
  <g filter="url(#softGlow)">
    <path d="M50 14 C65 14 84 25 84 46 C84 68 66 84 50 86 C34 84 16 68 16 46 C16 25 35 14 50 14 Z" fill="url(#outerRibbon)" />
    
    <!-- Diagonal Satin Ribbon Folds -->
    <path d="M50 18 C62 18 78 28 77 48 C76 66 61 78 50 82 C39 78 24 66 23 48 C22 28 38 18 50 18 Z" fill="url(#midRibbon)" />
    
    <!-- Overlapping Petal Swirl 1 -->
    <path d="M32 34 C44 22 68 24 74 38 C79 50 71 66 59 72 C48 77 34 68 30 56 C27 46 30 38 32 34 Z" fill="url(#innerFold)" opacity="0.95" />

    <!-- Overlapping Petal Swirl 2 -->
    <path d="M66 38 C56 28 40 32 36 44 C32 54 40 66 52 68 C62 70 70 60 70 50 C70 42 68 40 66 38 Z" fill="url(#midRibbon)" />

    <!-- Center Satin Rosebud Core -->
    <path d="M45 42 C52 36 60 40 60 48 C60 56 52 60 46 58 C42 56 40 50 42 46 C43 44 44 43 45 42 Z" fill="url(#innerFold)" />
    <path d="M48 46 C52 44 56 46 56 50 C56 54 52 56 49 55 C47 54 46 51 47 48 C47 47 48 46 48 46 Z" fill="url(#goldFilament)" />

    <!-- Silky Ribbon Highlights -->
    <path d="M38 24 C46 20 58 20 66 25 C60 23 48 22 38 24 Z" fill="#FFFFFF" opacity="0.6" />
    <path d="M25 44 C28 36 36 30 45 28 C37 31 30 37 25 44 Z" fill="#FFFFFF" opacity="0.4" />
    <path d="M75 44 C72 36 64 30 55 28 C63 31 70 37 75 44 Z" fill="#FFFFFF" opacity="0.4" />
  </g>
  
  <!-- Subtle Sparkle Accent -->
  <circle cx="72" cy="22" r="2.5" fill="#FFF9D2" />
  <path d="M72 17 L73.5 21 L77.5 22 L73.5 23 L72 27 L70.5 23 L66.5 22 L70.5 21 Z" fill="url(#goldFilament)" />
</svg>
